[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tron2-env"
version = "0.1.0"
description = "Public TRON2 runtime package for robot control, observations, and RTC helpers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_DEPENDENCIES.md"]
dependencies = [
    "numpy>=1.22",
    "opencv-contrib-python>=4.10,<5",
    "Pillow>=10",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
bridge = ["websockets>=12"]
camera = ["pyrealsense2"]
openpi = ["einops>=0.8"]
replay = [
    "polars>=1.30.0",
    "PyYAML>=6.0",
]
dev = [
    "build>=1.2",
    "pytest>=8",
]
all = [
    "websockets>=12",
    "pyrealsense2",
    "einops>=0.8",
    "polars>=1.30.0",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
